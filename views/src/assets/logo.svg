<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6ef7"/>
      <stop offset="0.5" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#b06cf0"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#1b1740"/>
      <stop offset="0.55" stop-color="#120c2b"/>
      <stop offset="1" stop-color="#070512"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b06cf0" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#7c4dff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vortex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6ef7"/>
      <stop offset="1" stop-color="#c38cf7"/>
    </linearGradient>
  </defs>

  <!-- outer frame -->
  <circle cx="32" cy="32" r="31" fill="url(#frame)"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#e6ddff" stroke-opacity="0.35" stroke-width="1.4"/>
  <!-- glass -->
  <circle cx="32" cy="32" r="25" fill="url(#glass)"/>

  <!-- vortex spiral (sucked-in space) -->
  <path d="M 32 32
           m 0.8 0
           a 2.4 2.4 0 0 1 -2.4 2.4
           a 5 5 0 0 1 -5 -5
           a 8 8 0 0 1 8 -8
           a 11 11 0 0 1 11 11
           a 14 14 0 0 1 -14 14
           a 16.5 16.5 0 0 1 -16.5 -16.5"
        fill="none" stroke="url(#vortex)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- black hole -->
  <circle cx="32" cy="32" r="9" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="3.4" fill="#000000"/>
  <circle cx="32" cy="32" r="3.4" fill="none" stroke="#c38cf7" stroke-width="1" stroke-opacity="0.7"/>

  <!-- fairy-tale sparkles -->
  <g fill="#e6ddff" opacity="0.9">
    <path d="M 15 15 l 1.2 3.2 l 3.2 1.2 l -3.2 1.2 l -1.2 3.2 l -1.2 -3.2 l -3.2 -1.2 l 3.2 -1.2 z"/>
    <path d="M 51 13 l 1 2.6 l 2.6 1 l -2.6 1 l -1 2.6 l -1 -2.6 l -2.6 -1 l 2.6 -1 z"/>
    <path d="M 50 49 l 0.9 2.4 l 2.4 0.9 l -2.4 0.9 l -0.9 2.4 l -0.9 -2.4 l -2.4 -0.9 l 2.4 -0.9 z"/>
    <circle cx="14" cy="50" r="1.1"/>
    <circle cx="56" cy="30" r="0.9"/>
  </g>
</svg>
